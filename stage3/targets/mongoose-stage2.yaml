# Personal Stage 2 target: frozen Mongoose 7.21 HTTP server.
# Fetch source once, then start the whitebox stack from the repo root:
#   ./stage3/scripts/fetch_mongoose.sh
#   docker compose -f personal-stage2/compose.yaml --profile whitebox up -d --wait
target_id: mongoose-stage2
analyst_brief: >
  The service is a frozen Mongoose HTTP/1.1 server on TCP port 8000.
  TLS is off. You may read the fetched source tree. To test a hypothesis,
  call run_target with input_text set to one raw HTTP request, including
  the request line, headers, and body. Chunked bodies use Transfer-Encoding
  chunked framing: chunk-size, CRLF, chunk-data, CRLF. The harness sends
  those bytes to the running server. A useful observation is the client
  JSON: a reply, a timeout, a closed connection, or a later failed health
  check. Do not assume a CVE, a patch, or a known crashing request.
source_root: vendor/mongoose
allowed_suffixes: [".c", ".h", ".md", ".txt"]
run_target:
  argv:
    - python3
    - stage3/scripts/relay_docker.py
    - --compose-file
    - personal-stage2/compose.yaml
    - --profile
    - whitebox
    - --service
    - whitebox
    - --host-dir
    - personal-stage2/results/whitebox/stage3-inputs
    - --guest-dir
    - /workspace/results/stage3-inputs
    - --input
    - "{input_file}"
    - --
    - python3
    - /opt/lab/tools/http_client.py
    - send
    - --input
    - "{guest_input}"
    - --output-dir
    - /workspace/results/stage3-inputs
    - --stem
    - "{stem}"
  cwd: ..
limits:
  max_steps: 8
  max_output_tokens: 1200
  max_cost_usd: 0.05
  max_read_lines: 120
  max_output_chars: 4000
  tool_timeout_s: 30
  python_timeout_s: 10
  target_timeout_s: 20
model:
  default: openai/gpt-4o-mini
  temperature: 0.2
